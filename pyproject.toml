[project]
name = "ghostlab-clone"
version = "0.1.0"
description = "SaaS platform for search behavior analytics and traffic management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "aio-pika>=9.5.0",
    "celery>=5.4.0",
    "supervisor>=4.3.0",
    "python-multipart>=0.0.20",
    "tzdata>=2024.1",  # zoneinfo data for the scheduler (Windows has no system tz database)
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false  # an app, not a library: `uv sync` installs dependencies only

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# SQLAlchemy warnings (e.g. cartesian products from a missing join) are bugs, not noise
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
