[project]
name = "ghostlab-clone"
version = "0.1.0"
description = "SaaS platform for search behavior analytics and traffic management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "aio-pika>=9.5.0",
    "celery>=5.4.0",
    "ratelimit>=2.2.1",
    "python-multipart>=0.0.20",
]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
