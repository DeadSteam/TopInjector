services:
  # Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ghostlab}
    # No host port: Postgres is reachable only on the internal docker network.
    expose: ["5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped  # come back after a Docker / machine restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghostlab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # No host port: Redis is reachable only on the internal docker network.
    expose: ["6379"]
    restart: unless-stopped  # come back after a Docker / machine restart
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # RabbitMQ for async event bus within monolith
  rabbitmq:
    image: rabbitmq:3-management-alpine
    # No host ports: broker and management UI stay on the internal docker network.
    expose: ["5672", "15672"]
    restart: unless-stopped  # come back after a Docker / machine restart
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-topinjector}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main FastAPI application (modular monolith + Celery worker + Celery beat via supervisor)
  api:
    build: .
    expose: ["8000"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ghostlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ghostlab}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-topinjector}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672"
      # Signing secret for JWTs — must be unique and >= 32 chars; the app refuses to boot otherwise.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 random chars)}
      DEBUG: "false"
      # Set to "true" once the panel is served over HTTPS so auth cookies get the Secure flag.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Links in verification e-mails point here (nginx)
      FRONTEND_URL: "http://localhost:8082"
      # Comma-separated emails that may open the admin panel (/api/projects/admin/stats)
      ADMIN_EMAILS: "admin@topinjector.com,admin2@topinjector.com"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # SvelteKit frontend
  frontend:
    build: ./frontend
    expose: ["3000"]
    environment:
      VITE_API_URL: "/"
    depends_on: [api]
    restart: unless-stopped

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, api]
    restart: unless-stopped

volumes:
  pgdata:
